name: snrXvAI-update
concurrency:
  group: snrxvai
  cancel-in-progress: false
# Controls when the workflow will run
on:
  workflow_dispatch: # manual
    inputs:
      models:
        description: Which models to use
        type: choice
        options:
          - dev
          - free
          - cheap
          - all
          - balanced
          - schedule
        default: dev
  schedule:
    - cron: '23 1 * * 1' # 01:23 Mondays

permissions:
  contents: read   

# jobs
jobs:
  build: # Build 
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install packages
        run: | 
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install texlive-latex-base texlive-latex-recommended texlive-pictures latexmk ocaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Make grammar
        working-directory: degenerate/grammar
        run: |
          perl compile-grammar snarxiv_titles.gram snarxiv_titles
          ocamlc snarxiv_titles.ml -o title_generator
      - name: Compute run timestamp for logs
        run: echo "RUN_TS=$(date -u +%F_%H%M%S)" >> "$GITHUB_ENV"
      - name: Generate papers              
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODELS: ${{ inputs.models }}
        id: generate
        run: |
          if [ "${MODELS:-schedule}" = schedule ]; then
            python -m degenerate.main -S
          else
            python -m degenerate.main -M "$MODELS"
          fi
      - name: Upload local failure logs
        if: ${{ !cancelled() && hashFiles('failed/errors.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            failed/
          retention-days: 7
      - name: Publish listings
        run: python -m degenerate.publish
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/
      - name: Checkout target repo
        if: ${{ !cancelled() }}
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          repository: blaircda/snrXvAI-logs
          ssh-key: ${{ secrets.LOGS_DEPLOY_KEY }}
          path: target
      - name: Copy logs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "target/logs/$RUN_TS/"
          mkdir "target/logs/$RUN_TS/failed"
          mkdir "target/logs/$RUN_TS/papers"
          cp degenerate/errors.json "target/logs/$RUN_TS/"
          cp failed/* "target/logs/$RUN_TS/failed/"
          cp papers/*.tex "target/logs/$RUN_TS/papers/"
          cp degenerate/listing.json "target/logs/$RUN_TS/"
      - name: Push to log repo
        if: ${{ !cancelled() }}
        working-directory: target
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "logs/$RUN_TS" 
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Update generated files"
            git push
          fi   
  deploy: # Deploy site if build finished
    needs: build
    if: github.event_name == 'schedule' || inputs.models != 'dev'
    permissions:
      pages: write      
      id-token: write   
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 

