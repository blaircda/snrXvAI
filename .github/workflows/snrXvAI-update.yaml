name: snrXvAI-update
  
# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      Npapers:
        type: number
        default: 1
      Ncollabs: 
        type: number
        default: 0

permissions:
  contents: read   

# jobs
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install packages
        run: | 
          sudo apt-get update
          sudo apt-get -y --no-install-recommends install texlive-latex-base texlive-latex-recommended texlive-pictures latexmk ocaml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Look around
        run: | 
          ls -R -I .git
          python --version
          pdflatex --version
          latexmk -v
          ocamlc -version
      - name: Make grammar
        working-directory: degenerate/grammar
        run: |
          perl compile-grammar snarxiv_titles.gram snarxiv_titles
          ocamlc snarxiv_titles.ml -o title_generator
      - name: Generate papers              
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NPAPERS: ${{ inputs.npapers || 5}}
          NCOLLABS: ${{ inputs.ncollabs || 1}}
        run: |
          python -m degenerate.main -N "$NPAPERS" -C "$NCOLLABS"
          python -m degenerate.publish
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
  # Deploy job
  deploy:
    needs: build
    permissions:
      pages: write      
      id-token: write   
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 

